name: Unit Tests

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        # Added pytorch-lightning and scikit-learn below
        pip install pytest pytest-cov torch transformers fastapi httpx pandas pytorch-lightning scikit-learn

    - name: Run Tests with Coverage
      run: |
        python -m pytest --cov=disaster_tweets tests/
