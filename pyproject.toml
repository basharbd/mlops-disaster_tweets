[tool.ruff]
# Ignore these folders so ruff doesn't check library code
exclude = [
    ".git",
    ".venv",
    "venv",
    "env",
    "__pycache__",
    "build",
    "dist",
    "wandb",
    "site-packages"
]
line-length = 88

[tool.ruff.lint]
# specific rules to ignore if needed
ignore = ["E501"] # Ignore line too long
