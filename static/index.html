<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disaster Tweet Detector 🚨</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background-color: #f4f4f9; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        textarea { width: 100%; height: 100px; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box;}
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        #result { margin-top: 20px; padding: 15px; border-radius: 5px; text-align: center; font-weight: bold; display: none; }
        .disaster { background-color: #ffebee; color: #c62828; border: 1px solid #c62828; }
        .safe { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #2e7d32; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚨 Disaster Tweet Detector</h1>
    <p>Enter a tweet below to check if it's about a real disaster.</p>

    <textarea id="tweetInput" placeholder="Type something like: 'Forest fire spreading fast!'"></textarea>
    <button onclick="checkTweet()">Analyze Tweet</button>

    <div id="result"></div>
</div>

<script>
    async function checkTweet() {
        const text = document.getElementById("tweetInput").value;
        const resultDiv = document.getElementById("result");

        if (!text) return;

        resultDiv.style.display = "block";
        resultDiv.innerText = "Analyzing...";
        resultDiv.className = "";

        try {
            const response = await fetch("/predict", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text: text })
            });

            const data = await response.json();

            if (data.prediction === "Disaster") {
                resultDiv.innerText = "⚠️ DANGER: This is a Disaster Tweet!";
                resultDiv.className = "disaster";
            } else {
                resultDiv.innerText = "✅ SAFE: This is a Normal Tweet.";
                resultDiv.className = "safe";
            }
        } catch (error) {
            resultDiv.innerText = "Error connecting to server.";
        }
    }
</script>

</body>
</html>
